# Runs insider_alerts.py every 5 minutes on GitHub's servers (free for public repositories),
# and publishes the iPhone app (encrypted data) to GitHub Pages whenever something changed.
# Save this file in your repository at:  .github/workflows/insider-alerts.yml
name: insider-alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: insider-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.export.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Needed only for the iPhone app (encrypts your data and sends push notifications).
      - name: Install app dependency
        run: pip install cryptography

      - name: Restore saved state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check for insider buys and sell signals
        env:
          IA_SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          IA_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IA_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional settings: add them under Settings > Secrets and variables > Actions > Variables.
          IA_MIN_PURCHASE_USD: ${{ vars.MIN_PURCHASE_USD || '15000' }}
          IA_MAX_HOLD_DAYS: ${{ vars.MAX_HOLD_DAYS || '5' }}
          # Automatic mode: every buy alert opens a tracked trade, and the sell alert reports the % result.
          IA_AUTO_TRACK: ${{ vars.AUTO_TRACK || 'true' }}
          IA_POSITION_USD: ${{ vars.POSITION_USD || '100' }}
          # Dip-buy scanner (runs once a day after the US market closes). SCAN_ENABLED = false turns it off.
          IA_SCAN_ENABLED: ${{ vars.SCAN_ENABLED }}
          IA_SCAN_TICKERS: ${{ vars.SCAN_TICKERS }}
          # Which scanner bots run: SCAN_BOTS = dip,breakout,trend,gap (default: all four). EXIT_SIGNALS = false turns off the extra sell signals.
          IA_SCAN_BOTS: ${{ vars.SCAN_BOTS }}
          IA_EXIT_SIGNALS: ${{ vars.EXIT_SIGNALS }}
          IA_STOP_LOSS_PCT: ${{ vars.STOP_LOSS_PCT }}
          IA_TAKE_PROFIT_PCT: ${{ vars.TAKE_PROFIT_PCT }}
          IA_TRAILING_STOP_PCT: ${{ vars.TRAILING_STOP_PCT }}
          IA_WATCHLIST: ${{ vars.WATCHLIST }}
          IA_DB_PATH: state/insider.db
        run: python insider_alerts.py cloud

      # Builds the app + encrypted data. The password never leaves GitHub; the public site only holds encrypted data.
      - name: Build the iPhone app
        id: export
        env:
          IA_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IA_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IA_SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          IA_APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          IA_DB_PATH: state/insider.db
        # A manual "Run workflow" always republishes, so you can retry after turning Pages on.
        run: python insider_alerts.py export-app --out site ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: Package the site
        if: steps.export.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
